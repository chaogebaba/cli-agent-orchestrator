# WP-ARCH Amendment A slice B1.  The roster's count assertions moved 12 -> 13
# rather than these two tools being folded into S09: ``answer_user_prompt``
# answers a PROVIDER DIALOG in somebody's pane, ``answer_question`` settles a
# DURABLE gate row, and rostering them together would record two different waits
# as one surface.  D3's freeze exists to stop an unrostered tool shipping, not to
# stop a genuinely new surface being declared.
[[surface]]
id = "S13"
name = "ask_supervisor / answer_question (durable gate questions)"
mcp_tools = ["ask_supervisor", "answer_question"]
invariants = ["UX-3"]
obligation = "C"

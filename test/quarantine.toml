# F254 D31 / WP-SUITE D5 — Quarantine registry.
#
# Every test that is known-flaky or known-red lives here with a class, reason,
# owner, and expiry. The tier plugin (test/plugins/quarantine.py) reads this at
# collection time and applies the D32 behaviour per class.
#
# Classes (D32):
#   serial_only  — permanently serialized after diagnosis. Same scheduling as
#                  xdist_flaky (xdist_group("quarantine-serial")) but with a
#                  mandatory verdict pointer and a known root cause. Burn-down
#                  criterion: fix the fixture isolation bug named in `reason`.
#   xdist_flaky  — passes serial, fails under -n 2. Serialized via xdist_group("quarantine-serial").
#   worker_crash — crashes the xdist worker (loses co-scheduled tests). Deselected under -n > 0
#                  unless CAO_TEST_QUARANTINE=run. Serialized when it does run.
#   known_red    — fails serial too. Marked xfail(strict=False, run=True) so recovery is noticed.
#
# --- Burn-down criteria (D5 AC5.3) ---
#
# Each entry MUST carry:
#   class    — one of the classes above
#   reason   — human-readable root-cause description
#   filed    — UTC date (YYYY-MM-DD) when the entry was added
#   review_by — filed + 30 days; the ledger's own expiry enforced by the suite
#
# Enforcement: `make test-hygiene` FAILS (exit 1) if any entry's review_by is
# in the past. The quarantine_expiry plugin (test/plugins/quarantine_expiry.py)
# checks this at collection time via pytest_configure.
#
# An entry past review_by must be resolved: either fix the test (remove entry),
# re-file with a new review_by (requires a reason update documenting progress),
# or escalate to known_red with an incident link.
#
# Precedent: P-SEEDFILE (test/simulation/failing_seeds.txt, test/plugins/smoke_tags.py:16-49).


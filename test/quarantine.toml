# --- WP-ARCH phase 1 (F725 #581): test_f72_fleet_lifecycle.py, whole file ---
#
# Root cause (lane A's investigation, confirmed independently by lanes B and C):
# the module carries its own latent race and it flakes on BASE trees that contain
# none of the three lanes' code. At :273 it creates a CallbackBarrierModel with
# `timeout_at=datetime.now(timezone.utc)` — a barrier already expired at the
# moment of creation — and then asserts at :321 that the barrier reached
# CANCELLED; whether the cancelling path beats the timeout path is a scheduling
# question. Its final assertions then read rows[0] and rows[1] off an id-ordered
# query, which is order-sensitive by construction.
#
# Evidence that it is not any lane's diff: the `f72_env` fixture (:86) builds an
# in-memory SQLite engine and monkeypatches SessionLocal onto it, and never starts
# the FastAPI app — so bootstrap.start_worker_truth never runs, the phase-1 tables
# are never created in its database, and no new-tree code executes inside it at
# all. Four distinct tests in the file failed sporadically across two lanes, two
# of them on base arms, and two base arms disagreed with each other about which
# failed. All passed 5/5 when re-run in isolation.
#
# WHOLE FILE, and enumerated from `pytest --collect-only`, not from the source.
# test/plugins/quarantine.py matches `item.nodeid` by exact dict lookup, so a
# single file-level entry would be silently inert — the #559 failure mode, a rule
# that looks configured and never applies. Three of these tests are PARAMETRIZED
# and collect as 10 distinct nodeids with `[...]` suffixes; entries written from
# the function names alone would have left those 10 unquarantined while looking
# complete. 37 collected nodeids, 37 entries. Regenerate the same way.
#
# Class is `xdist_flaky`, which SERIALIZES rather than deselects, so every test
# still runs and coverage is unchanged.
#
# Burn-down: fix the already-expired barrier and the positional row assertions,
# then delete this block. Filed against the fix issue, not against WP-ARCH.


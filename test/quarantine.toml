# F254 D31 — Quarantine registry.
#
# Every test that is known-flaky or known-red lives here with a class, reason,
# owner, and expiry. The tier plugin (test/plugins/quarantine.py) reads this at
# collection time and applies the D32 behaviour per class.
#
# Classes (D32):
#   xdist_flaky  — passes serial, fails under -n 2. Serialized via xdist_group("quarantine-serial").
#   worker_crash — crashes the xdist worker (loses co-scheduled tests). Deselected under -n > 0
#                  unless CAO_TEST_QUARANTINE=run. Serialized when it does run.
#   known_red    — fails serial too. Marked xfail(strict=False, run=True) so recovery is noticed.
#
# Precedent: P-SEEDFILE (test/simulation/failing_seeds.txt, test/plugins/smoke_tags.py:16-49).

# --- F238 xdist-sensitive: shared TracerProvider state across workers ---
# These tests use a shared InMemorySpanExporter (process-global OTel TracerProvider).
# Under -n 2, other OTel-using tests on the same worker corrupt the exporter's
# span list. Serialization alone doesn't help — the pollution comes from non-quarantined
# OTel tests co-scheduled on the same worker. Classified as worker_crash per D32:
# they corrupt the shared resource for co-scheduled tests (same impact class).

[[entry]]
nodeid  = "test/telemetry/test_spans.py::TestInvokeAgentSpan::test_emits_invoke_agent_with_required_attributes"
class   = "worker_crash"
reason  = "F238 — shared TracerProvider corrupted by co-scheduled OTel tests; passes serial only"
owner   = "F238"
expires = "2026-10-01"


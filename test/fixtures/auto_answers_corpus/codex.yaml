- name: codex-usage-resets
  enabled: true
  match_mode: regex
  question: You have \d+ usage limit resets available
  options:
  - Yes, continue
  - No, quit
  answer: wait
- name: codex-trust-dir
  modality: hard
  enabled: true
  match_mode: contains
  question: Do you trust the contents of this directory?
  options:
  - Yes, continue
  - No, quit
  answer:
  - Enter
- name: codex-trust-dir-subdir
  modality: hard
  enabled: true
  match_mode: contains
  question: subdirectory of a Git project. Trusting will apply to the repository root
  options:
  - Press enter to continue
  answer:
  - Enter
- name: codex-hooks-trust
  modality: hard
  enabled: true
  match_mode: regex
  question: Hooks need review \d+ hooks? (is|are) new or changed
  options:
  - Review hooks
  - Trust all and continue
  - Continue without trusting
  answer:
  - Down
  - Enter
- name: codex-fork-workdir-choice
  enabled: true
  match_mode: contains
  question: Choose working directory to fork this session
  options:
  - Use session directory
  - Use current directory
  answer:
  - Down
  - Enter
- name: codex-resume-workdir-choice
  enabled: false
  match_mode: contains
  question: Choose working directory to resume this session
  options:
  - Use session directory
  - Use current directory
  answer:
  - Down
  - Enter
- name: codex-ratelimit-model-switch
  enabled: true
  match_mode: regex

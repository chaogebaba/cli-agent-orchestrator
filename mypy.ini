[mypy]
python_version = 3.14
# Resolve ``cli_agent_orchestrator`` from the SOURCE tree, not from the installed
# copy in the venv (WP-ARCH phase 2a).
#
# Without this, checking a file under ``test/`` resolves the package through
# site-packages, which ships no PEP 561 ``py.typed`` marker — so mypy treats the
# whole package as untyped and reports ``import-untyped`` for every import plus
# ``no-untyped-call`` for every call through one. That was 111 of the 131 errors
# a strict run over the touched tests produced, none of them a real type problem,
# and they buried the ~20 that were.
#
# ``mypy_path`` rather than a ``py.typed`` marker on purpose: the marker changes
# what the built distribution promises to downstream consumers, which is a
# packaging decision this sub-phase has no business making. This changes only how
# the checker resolves imports, so a bare ``mypy --strict <file>`` behaves the
# same for everyone, including a gate replaying the command verbatim.
mypy_path = src
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = False

# Ignore missing stubs for these modules
[mypy-frontmatter.*]
ignore_missing_imports = True

[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-cli_agent_orchestrator.adapters.database]
ignore_missing_imports = True

# Allow SQLAlchemy ORM issues
[mypy-cli_agent_orchestrator.clients.database]
disable_error_code = misc,assignment,arg-type

# Ignore specific issues in CLI commands
[mypy-cli_agent_orchestrator.cli.commands.install]
disable_error_code = assignment

# Ignore MCP server Any return types
[mypy-cli_agent_orchestrator.mcp_server.server]
disable_error_code = no-any-return

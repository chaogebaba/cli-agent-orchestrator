name: Fork CI – test-ci parity suite

on:
  push:
    branches:
      - 'cao/**'
  workflow_dispatch:

jobs:
  test-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Run test-ci suite
        run: |
          uv run pytest \
            -m "not live and not e2e" \
            -n 4 \
            --dist loadgroup \
            --strict-markers \
            -p no:randomly \
            --timeout=30 \
            --timeout-method=thread \
            --junitxml=junit-results.xml \
            --tb=short \
            -q \
            --deselect test/utils/test_persona_context.py::test_manifest_rehydration_fails_loud_on_inaccessible_persona_root \
            --deselect test/utils/test_persona_context.py::test_filter_and_compose_claude_manifest_rehydration \
            --deselect test/utils/test_persona_context.py::test_manifest_rehydration_fails_loud_on_invalid_runtime_root \
            --deselect test/utils/test_persona_context.py::test_reap_persona_generations_keeps_current_only \
            --deselect test/utils/test_persona_context.py::test_provider_manager_rehydrates_manifest_plan \
            --deselect test/utils/test_persona_context.py::test_generation_reaper_fails_loud_on_inaccessible_persona_root \
            --deselect test/test_f139_fixture_provider.py::TestAdmitProvider::test_credential_provider_still_admitted \
            --deselect test/services/test_f93_terminal_identity_resolution.py::test_ac5_herdr_inherits_error_liveness_and_never_auto_purges \
            --deselect test/services/test_wave3b_supervisor_mailbox.py::test_probe_09_raw_addressed_output_bytes_match_parent_33aad1c \
            --deselect test/services/test_fifo_reader.py::TestReaderLoopCoalescing::test_rapid_writes_produce_fewer_publishes_than_writes

      - name: Generate last-lines summary
        if: always()
        run: |
          echo "=== Test run summary ===" > last-lines.txt
          if [ -f junit-results.xml ]; then
            # Extract test counts from junit XML
            grep -o 'tests="[^"]*"\|failures="[^"]*"\|errors="[^"]*"\|skipped="[^"]*"' junit-results.xml | head -4 >> last-lines.txt
          fi
          echo "" >> last-lines.txt
          echo "See junit-results.xml for full structured results" >> last-lines.txt

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit-results.xml
            last-lines.txt
          retention-days: 14
